name: Build, Test and Release

on:
  push:
    branches: [ "main", "linux-support" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# Serialize release-producing runs on the same ref so the build-counter
# version job never reads a stale tag. Merges to main queue (never cancel)
# so every merge gets its own incremented version. Feature branches stay parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Compute the version once per run and decide whether to release:
  #  - push to main -> auto-increment build counter (v1.0.N), publish "Latest" release
  #  - tag v*       -> use the tag version, publish release
  #  - anything else -> 0.0.0-dev, no release
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need full tag history for the build counter

      - id: v
        env:
          EVENT: ${{ github.event_name }}
        run: |
          release=false
          tag=""

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Explicit tag release. Strip leading 'v' (e.g. v1.2.3 -> 1.2.3).
            tag="$GITHUB_REF_NAME"
            ver="${tag#v}"
            # deb/rpm require versions starting with a digit; prefix if needed.
            if [[ ! "$ver" =~ ^[0-9] ]]; then
              ver="0.0.0+$(echo "$ver" | sed 's/^[^a-zA-Z0-9]*//')"
            fi
            release=true
          elif [[ "$EVENT" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Auto build-counter release on every merge to main: v0.2.N-beta.
            git fetch --tags --force
            latest=$(git tag -l 'v0.2.*-beta' \
              | sed -n 's/^v0\.2\.\([0-9][0-9]*\)-beta$/\1/p' \
              | sort -n | tail -1)
            next=$(( ${latest:-0} + 1 ))
            ver="0.2.${next}-beta"
            tag="v0.2.${next}-beta"
            release=true
          else
            # Feature-branch push / PR / manual dispatch: build and test only.
            ver="0.0.0-dev"
          fi

          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"     >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${ver} tag=${tag} release=${release}"

  build:
    name: Build and Test on ${{ matrix.runner }} (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            os_name: macos-apple-arm64
            platform: darwin
          - runner: macos-15-intel
            arch: amd64
            os_name: macos-intel-amd64
            platform: darwin
          - runner: ubuntu-latest
            arch: amd64
            os_name: linux-amd64
            platform: linux
          - runner: ubuntu-24.04-arm
            arch: arm64
            os_name: linux-arm64
            platform: linux

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Install Linux build dependencies
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libgl1-mesa-dev \
          xorg-dev \
          libxcursor-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxi-dev \
          libxxf86vm-dev \
          libwayland-dev \
          libxkbcommon-dev \
          wayland-protocols \
          gcc

    - name: test
      run: make test

    - name: Build
      run: VERSION=${{ needs.version.outputs.version }} make build

    - name: End-to-end test
      if: matrix.platform == 'darwin'
      run: make e2e

    - name: Install fyne CLI (macOS)
      if: matrix.platform == 'darwin'
      run: go install fyne.io/tools/cmd/fyne@latest

    - name: Build macOS .app bundle and .pkg installer
      if: matrix.platform == 'darwin'
      run: |
        VERSION=${{ needs.version.outputs.version }} \
        PKG_OUTPUT=EverythingX_${{ matrix.os_name }}.pkg \
        make pkg

    - name: Upload artifact (macOS .pkg)
      if: matrix.platform == 'darwin'
      uses: actions/upload-artifact@v7
      with:
        name: everythingx_pkg_${{ matrix.os_name }}
        path: EverythingX_${{ matrix.os_name }}.pkg
        if-no-files-found: error

    - name: Install nfpm (Linux)
      if: matrix.platform == 'linux'
      run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

    - name: Build Linux packages (.deb / .rpm)
      if: matrix.platform == 'linux'
      run: |
        VERSION=${{ needs.version.outputs.version }} make deb
        VERSION=${{ needs.version.outputs.version }} make rpm

    - name: Rename Linux packages to stable asset names
      if: matrix.platform == 'linux'
      run: |
        # nfpm stamps the version + rpm arch into the filename; the installer
        # downloads by a fixed name, so normalize to everythingx_linux_<arch>.<ext>.
        mv bin/*.deb "everythingx_linux_${{ matrix.arch }}.deb"
        mv bin/*.rpm "everythingx_linux_${{ matrix.arch }}.rpm"

    - name: Upload artifact (Linux packages)
      if: matrix.platform == 'linux'
      uses: actions/upload-artifact@v7
      with:
        name: everythingx_linux_${{ matrix.arch }}
        path: |
          everythingx_linux_${{ matrix.arch }}.deb
          everythingx_linux_${{ matrix.arch }}.rpm
        if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: write

    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        # On auto (main) runs github.ref is a branch, so name the tag explicitly.
        # The action creates this tag at the run's commit if it does not exist.
        # (Tag is created via GITHUB_TOKEN, which does NOT re-trigger this workflow.)
        tag_name: ${{ needs.version.outputs.tag }}
        name: ${{ needs.version.outputs.tag }}
        generate_release_notes: true
        make_latest: "true"
        files: |
          artifacts/**/*.pkg
          artifacts/**/*.deb
          artifacts/**/*.rpm



  # Point the Homebrew tap (AlanKK/homebrew-everythingx) at this release.
  # Every release reaches here, so a beta built after a higher manual tag
  # would downgrade brew users; the version guard skips anything not newer.
  publish-homebrew:
    name: Publish Homebrew cask
    needs: [version, release]
    runs-on: ubuntu-latest
    if: needs.version.outputs.release == 'true'
    concurrency:
      group: publish-brew
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v7

    - name: Download macOS .pkg artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: everythingx_pkg_*
        merge-multiple: true
        path: pkgs/

    - name: Check out tap
      uses: actions/checkout@v7
      with:
        repository: AlanKK/homebrew-everythingx
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        path: tap

    - name: Render and push cask
      env:
        TAG: ${{ needs.version.outputs.tag }}
        VERSION: ${{ needs.version.outputs.version }}
      run: |
        cask=tap/Casks/everythingx.rb
        mkdir -p tap/Casks

        # Compare as Debian versions with '-' read as '~' (same mapping nfpm
        # uses), so 0.2.9-beta < 0.2.10-beta < 1.0.0.
        if [ -f "$cask" ]; then
          current=$(sed -n 's/^ *version "\(.*\)"$/\1/p' "$cask" | head -1)
          new_cmp=$(printf '%s' "$VERSION" | tr - '~')
          cur_cmp=$(printf '%s' "$current" | tr - '~')
          if ! dpkg --compare-versions "$new_cmp" gt "$cur_cmp"; then
            echo "Tap already serves ${current}; ${VERSION} is not newer, skipping."
            exit 0
          fi
        fi

        package/homebrew/render-cask.sh "$TAG" "$VERSION" \
          pkgs/EverythingX_macos-apple-arm64.pkg \
          pkgs/EverythingX_macos-intel-amd64.pkg > "$cask"

        cd tap
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add Casks/everythingx.rb
        git commit -m "everythingx ${TAG}"
        git push

  # Rebuild the apt repo (alankk.github.io/everythingx) from the newest
  # releases and deploy it to GitHub Pages. The repo is rebuilt from scratch
  # each time and keeps the highest versions, so a beta built after a higher
  # manual tag never becomes the candidate and apt never downgrades.
  publish-apt:
    name: Publish apt repository
    needs: [version, release]
    runs-on: ubuntu-latest
    if: needs.version.outputs.release == 'true'
    concurrency:
      group: publish-apt
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
    - uses: actions/checkout@v7

    - name: Install apt-ftparchive
      run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends apt-utils

    - name: Download .deb files from recent releases
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --exclude-drafts \
            --json tagName --jq '.[].tagName'); do
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'everythingx_linux_*.deb' --dir "dl/$tag" \
            || echo "No .deb assets in $tag, skipping."
        done

    - name: Import signing key
      env:
        APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      run: printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

    - name: Build repository
      env:
        APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
      run: package/apt/build-repo.sh site dl/*/*.deb

    - uses: actions/upload-pages-artifact@v5
      with:
        path: site

    - id: deploy
      uses: actions/deploy-pages@v5
