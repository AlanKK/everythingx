name: Test Published Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (e.g., v1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  test-macos-pkg:
    name: Test macOS pkg (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            os_name: macos-apple-arm64
          - runner: macos-15-intel
            os_name: macos-intel-amd64
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern "EverythingX_${{ matrix.os_name }}.pkg"

      - name: Install pkg
        run: sudo installer -pkg "EverythingX_${{ matrix.os_name }}.pkg" -target /

      - name: Verify installation
        run: |
          test -d /Applications/EverythingX.app
          test -f /Applications/EverythingX.app/Contents/MacOS/everythingx
          test -x /usr/local/bin/ev
          test -x /usr/local/bin/everythingxd
          test -f /Library/LaunchDaemons/com.github.alankk.everythingxd.plist
          ev --version
          everythingxd --version
          sudo launchctl print system/com.github.alankk.everythingxd >/dev/null

      - name: Cleanup
        if: always()
        run: |
          sudo launchctl bootout system /Library/LaunchDaemons/com.github.alankk.everythingxd.plist || true
          sudo rm -rf /Applications/EverythingX.app || true
          sudo rm -f /usr/local/bin/ev /usr/local/bin/everythingxd || true
          sudo rm -f /Library/LaunchDaemons/com.github.alankk.everythingxd.plist || true

  test-brew:
    name: Test Homebrew cask (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            os_name: macos-apple-arm64
          - runner: macos-15-intel
            os_name: macos-intel-amd64
    env:
      TAG: ${{ inputs.tag }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Install cask
        run: brew install --cask alankk/everythingx/everythingx

      - name: Verify installation
        run: |
          test -d /Applications/EverythingX.app
          test -f /Applications/EverythingX.app/Contents/MacOS/everythingx
          test -x /usr/local/bin/ev
          test -x /usr/local/bin/everythingxd
          test -f /Library/LaunchDaemons/com.github.alankk.everythingxd.plist
          ev --version
          everythingxd --version
          sudo launchctl print system/com.github.alankk.everythingxd >/dev/null
          # The tap installs whatever it serves, which may not be the tag under test.
          ev --version | grep -F "Version: ${TAG#v},"

      - name: Uninstall cask
        run: brew uninstall --cask everythingx

      - name: Verify removal
        run: |
          test ! -e /Applications/EverythingX.app
          test ! -e /usr/local/bin/ev
          test ! -e /usr/local/bin/everythingxd
          test ! -e /Library/LaunchDaemons/com.github.alankk.everythingxd.plist
          if sudo launchctl print system/com.github.alankk.everythingxd >/dev/null 2>&1; then
            echo "daemon still loaded"; exit 1
          fi
          if pkgutil --pkg-info com.github.alankk.pkg.EverythingX >/dev/null 2>&1; then
            echo "pkg receipt still present"; exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          brew uninstall --cask --force everythingx || true
          sudo launchctl bootout system /Library/LaunchDaemons/com.github.alankk.everythingxd.plist || true
          sudo rm -rf /Applications/EverythingX.app || true
          sudo rm -f /usr/local/bin/ev /usr/local/bin/everythingxd || true
          sudo rm -f /Library/LaunchDaemons/com.github.alankk.everythingxd.plist || true

  test-linux-deb:
    name: Test Linux .deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern "*${{ matrix.arch }}.deb"

      - name: Install .deb package
        run: sudo dpkg -i *.deb

      - name: Verify installation
        run: |
          test -x /usr/local/bin/everythingxd
          test -x /usr/local/bin/ev
          ev --version
          everythingxd --version
          systemctl is-active everythingxd

      - name: Stop daemon and run e2e test
        run: |
          sudo systemctl stop everythingxd
          mkdir -p bin
          ln -s /usr/local/bin/everythingxd bin/everythingxd
          go build -tags fts5 -o e2eTest/e2etest e2eTest/main.go
          sudo e2eTest/e2etest

      - name: Cleanup
        if: always()
        run: sudo dpkg -r everythingx || true

  test-apt:
    name: Test apt repository (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Add repository and install
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://alankk.github.io/everythingx/everythingx.gpg | sudo tee /etc/apt/keyrings/everythingx.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/everythingx.gpg] https://alankk.github.io/everythingx stable main" | sudo tee /etc/apt/sources.list.d/everythingx.list
          sudo apt-get update
          apt-cache policy everythingx
          sudo apt-get install -y everythingx

      - name: Verify installation
        run: |
          test -x /usr/local/bin/everythingxd
          test -x /usr/local/bin/ev
          ev --version
          everythingxd --version
          systemctl is-active everythingxd
          # The repo installs its highest version, which may not be the tag under test.
          ev --version | grep -F "Version: ${TAG#v},"

      - name: Stop daemon and run e2e test
        run: |
          sudo systemctl stop everythingxd
          mkdir -p bin
          ln -s /usr/local/bin/everythingxd bin/everythingxd
          go build -tags fts5 -o e2eTest/e2etest e2eTest/main.go
          sudo e2eTest/e2etest

      - name: Cleanup
        if: always()
        run: sudo apt-get purge -y everythingx || true

  test-linux-rpm:
    name: Test Linux .rpm (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install rpm tools
        run: sudo apt-get update -qq && sudo apt-get install -y rpm

      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern "*${{ matrix.arch }}.rpm"

      - name: Extract and verify RPM contents
        run: |
          rpm -qlp *.rpm
          mkdir rpm-extract && cd rpm-extract
          rpm2cpio ../*.rpm | cpio -idmv --no-absolute-filenames
          test -f usr/local/bin/everythingxd
          test -f usr/local/bin/ev
          test -f etc/systemd/system/everythingxd.service

      - name: Install and run e2e test
        run: |
          cd rpm-extract
          sudo cp usr/local/bin/everythingxd /usr/local/bin/
          sudo cp usr/local/bin/ev /usr/local/bin/
          sudo chmod +x /usr/local/bin/everythingxd /usr/local/bin/ev
          ev --version
          everythingxd --version
          mkdir -p bin
          ln -s /usr/local/bin/everythingxd bin/everythingxd
          go build -tags fts5 -o e2eTest/e2etest e2eTest/main.go
          sudo e2eTest/e2etest

      - name: Cleanup
        if: always()
        run: |
          sudo rm -f /usr/local/bin/everythingxd /usr/local/bin/ev || true
